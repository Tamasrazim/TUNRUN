name: Repository integrity

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: repo-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: Policy and Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate repository files and local Markdown links
        run: python3 scripts/check_repo.py
