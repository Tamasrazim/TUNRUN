name: Linux deterministic tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-tests:
    name: GCC deterministic unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake git pkg-config \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libxfixes-dev
      - name: Configure C++ tests
        run: cmake -S . -B build -DTUNRUN_ENABLE_TESTS=ON -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Debug
      - name: Compile portable test target
        run: cmake --build build --target tunrun_input_tests --parallel 2
      - name: Run deterministic and persistence tests
        run: ctest --test-dir build --output-on-failure
