name: Windows build and tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: MSVC x64 build and unit tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Configure
        run: cmake -S . -B build -A x64 -DTUNRUN_ENABLE_TESTS=ON -DBUILD_EXAMPLES=OFF
      - name: Compile
        run: cmake --build build --config Release --parallel 2
      - name: Run unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage portable development package
        shell: pwsh
        run: ./scripts/package-windows.ps1 -BuildDirectory build/Release -OutputDirectory build/package -Version "0.1.0-dev" -CommitSha $env:GITHUB_SHA

      - name: Publish portable development package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TUNRUN-Windows-x64-portable-dev
          path: build/package/TUNRUN-Windows-x64-Portable/
          if-no-files-found: error
          retention-days: 14
