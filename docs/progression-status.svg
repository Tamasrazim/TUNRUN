    <rect x="331" y="43" width="96" height="34" rx="4" fill="#163b3a" stroke="#69e6d7"/><text x="379" y="64" fill="#9bfff3">M3 · ACTIVE</text>
    <rect x="434" y="43" width="96" height="34" rx="4" fill="#163b3a" stroke="#69e6d7"/><text x="482" y="64" fill="#9bfff3">M4 · ACTIVE</text>
    <rect x="537" y="43" width="96" height="34" rx="4" fill="#163b3a" stroke="#69e6d7"/><text x="585" y="64" fill="#9bfff3">M5 · ACTIVE</text>
    <rect x="640" y="43" width="90" height="34" rx="4" fill="#141a20" stroke="#303b45"/><text x="685" y="64" fill="#83909b">M6 · PLAN</text>
    <rect x="737" y="43" width="90" height="34" rx="4" fill="#141a20" stroke="#303b45"/><text x="782" y="64" fill="#83909b">M7 · PLAN</text>
    <rect x="834" y="43" width="90" height="34" rx="4" fill="#141a20" stroke="#303b45"/><text x="879" y="64" fill="#83909b">M8 · PLAN</text>
