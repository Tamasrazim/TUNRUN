  <text x="1018" y="27" text-anchor="end" fill="#87939d" font-family="ui-monospace,monospace" font-size="10">MILESTONES M0–M9</text>
  <g font-family="ui-monospace,monospace" font-size="10" font-weight="700" text-anchor="middle">
